name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "v1.0.0"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter pydub

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "WAV-to-MP3-Converter" --collect-all customtkinter run.py

      - name: Package release
        shell: pwsh
        run: |
          @"
          WAV to MP3 Converter requires FFmpeg and FFprobe to be installed and available in PATH.
          The application checks for both tools at startup.
          "@ | Set-Content "FFMPEG_REQUIRED.txt"
          $zip = "WAV-to-MP3-Converter-$env:VERSION-Windows-x64.zip"
          Compress-Archive -Path "dist/WAV-to-MP3-Converter.exe", "README.md", "FFMPEG_REQUIRED.txt" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VERSION --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSION "dist/WAV-to-MP3-Converter.exe" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:VERSION "dist/WAV-to-MP3-Converter.exe" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --target "${{ github.sha }}" --title "WAV to MP3 Converter $env:VERSION" --generate-notes --repo "${{ github.repository }}"
          }
